name: Build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: image:linux-docker-bitvirt
    steps:
      - uses: actions/checkout@v7

      - name: Setup NodeJS with npm
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NodeJS dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
