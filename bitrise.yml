  sitemap_generator:
    description: |
      The workflow executes the tests. The *retry_on_failure* test repetition mode is enabled.

      Next steps:
      - Check out [Getting started with iOS apps](https://devcenter.bitrise.io/en/getting-started/getting-started-with-ios-apps.html).
    steps:
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            set -o pipefail
            set -x

            apt-get update

            apt-get -y install cabextract xfonts-utils

            MS_CORE_FONTS_VERSION="3.8.1"
            wget -nv "http://ftp.de.debian.org/debian/pool/contrib/m/msttcorefonts/ttf-mscorefonts-installer_${MS_CORE_FONTS_VERSION}_all.deb"
            apt-get -y install "./ttf-mscorefonts-installer_${MS_CORE_FONTS_VERSION}_all.deb"

            export DEBIAN_FRONTEND=noninteractive
            apt-get -y install fontconfig xvfb fonts-wqy-zenhei

            wget -nv "https://download.screamingfrog.co.uk/products/seo-spider/screamingfrogseospider_${SCREAMING_FROG_VERSION}_amd64.deb"
            md5sum "./screamingfrogseospider_${SCREAMING_FROG_VERSION}_amd64.deb"
            apt-get -y install "./screamingfrogseospider_${SCREAMING_FROG_VERSION}_amd64.deb"

            screamingfrogseospider --help
        title: Install Screaming Frog
    - script@1:
        inputs:
        - content: |
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            set -o pipefail
            set -x

            # create license file
            cat > ~/.ScreamingFrogSEOSpider/licence.txt<< EOF
            ${SF_USERNAME}
            ${SF_LICENSE_KEY}
            EOF

            # append settings to config file
            cat >> ~/.ScreamingFrogSEOSpider/spider.config<< EOF
            eula.accepted=${SCREAMING_FROG_EULA}
            storage.db_dir=/root/.ScreamingFrogSEOSpider
            storage.mode=DB
            embeddedBrowser.enable=false
            EOF
        title: Setup Screaming Frog
    - git-clone@8: {}
    - script@1:
        title: Crawl Bitrise.io
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            set -o pipefail
            set -x

            START=$(date +%s)

            screamingfrogseospider \
              --config "config/seo_spider_config.json" \
              --crawl https://bitrise.io \
              --headless \
              --create-sitemap 2>&1 | tee -a "$SITEMAP_LOG"

            envman add --key CRAWL_SECONDS --value "$(( $(date +%s) - START ))"
    - deploy-to-bitrise-io@2:
        inputs:
        - deploy_path: "/bitrise/src/sitemap.xml"
        title: Upload Sitemap.xml to Artifacts
    - script@1:
        title: Upload Sitemap.xml to GCP Storage
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            KEY_FILE_PATH=$(mktemp -d)/keyfile.json
            echo "${GCP_SA_SECRET_B64}" | base64 --decode > ${KEY_FILE_PATH}
            gcloud auth activate-service-account --key-file=${KEY_FILE_PATH}

            # keep the previous sitemap for the Slack diff (ignore failure, e.g. first run)
            gcloud storage cp gs://web-cdn.bitrise.io/sitemap.xml /tmp/sitemap_prev.xml || rm -f /tmp/sitemap_prev.xml

            # only log the gcloud output (not the xtrace above, which contains secrets)
            gcloud storage cp /bitrise/src/sitemap.xml gs://web-cdn.bitrise.io/sitemap.xml 2>&1 | tee -a "$SITEMAP_LOG"
    - script@1:
        title: Generate and upload sitemap breakdown chart
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # best effort: a chart problem must not fail the sitemap build
            set +e
            set -x

            cd "$BITRISE_SOURCE_DIR"
            CHART=/tmp/sitemap_breakdown.png
            # one image per build, so earlier Slack posts keep showing their own stats
            CHART_NAME="sitemap_breakdown_$(date -u +%Y%m%d-%H%M%S)_${BITRISE_BUILD_NUMBER}.png"
            CHART_GCS="gs://web-cdn.bitrise.io/sitemap_stats/${CHART_NAME}"

            npm install --no-save --no-package-lock --ignore-scripts sharp@0.34.5 \
              && node src/js/tools/sitemap-chart.mjs /bitrise/src/sitemap.xml "$CHART" \
              && gcloud storage cp "$CHART" "$CHART_GCS" \
                   --cache-control="public, max-age=31536000, immutable" \
              && envman add --key SITEMAP_CHART_URL --value "https://web-cdn.bitrise.io/sitemap_stats/${CHART_NAME}"

            exit 0
    - script@1:
        title: Compute sitemap stats
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eu
            FILE=/bitrise/src/sitemap.xml
            PREV=/tmp/sitemap_prev.xml
            URLS=$(grep -o '<loc>' "$FILE" | wc -l | tr -d ' ')
            SIZE=$(du -h "$FILE" | cut -f1)
            DURATION="$(( CRAWL_SECONDS / 60 ))m $(( CRAWL_SECONDS % 60 ))s"
            DIFF=""
            if [ -s "$PREV" ]; then
              grep -o '<loc>[^<]*</loc>' "$PREV" | sort -u > /tmp/prev_urls.txt
              grep -o '<loc>[^<]*</loc>' "$FILE" | sort -u > /tmp/new_urls.txt
              ADDED=$(comm -13 /tmp/prev_urls.txt /tmp/new_urls.txt | wc -l | tr -d ' ')
              REMOVED=$(comm -23 /tmp/prev_urls.txt /tmp/new_urls.txt | wc -l | tr -d ' ')
              DIFF=" (+${ADDED} / -${REMOVED})"
            fi
            envman add --key SITEMAP_STATS --value "${URLS} URLs${DIFF} · ${SIZE} · crawled in ${DURATION}"
    - slack@4:
        title: Notify Slack (success)
        inputs:
        - channel: "$SF_SLACK_CHANNEL"
        - from_username: Sitemap.xml Builder
        - webhook_url: "$SF_SLACK_WEBHOOK"
        - text: ":white_check_mark: Sitemap generated and uploaded to the CDN.\n$SITEMAP_STATS"
        - pretext: ''
        - author_name: ''
        - title: ''
        - message: ''
        - fields: ''
        - buttons: ''
        - footer: ''
        - timestamp: 'no'
        - image_url: "$SITEMAP_CHART_URL"
    - script@1:
        title: Notify Slack (failure)
        is_always_run: true
        run_if: ".IsBuildFailed"
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eu
            LOG_TAIL=$(tail -n 15 "$SITEMAP_LOG" 2>/dev/null | cut -c1-300 | tail -c 2500 || true)
            [ -n "$LOG_TAIL" ] || LOG_TAIL="(no log captured)"
            jq -n \
              --arg channel "$SF_SLACK_CHANNEL" \
              --arg text ":x: Sitemap generation failed - <${BITRISE_BUILD_URL}|view build>
            \`\`\`${LOG_TAIL}\`\`\`" \
              '{channel: $channel, username: "Sitemap.xml Builder", text: $text}' \
              | curl -sS -X POST -H 'Content-type: application/json' --data @- "$SF_SLACK_WEBHOOK"
    envs:
    - SF_SLACK_CHANNEL: "#webflow"
      opts:
        is_expand: false
    - SITEMAP_LOG: "/tmp/sitemap_error.log"
      opts:
        is_expand: false
    - SCREAMING_FROG_VERSION: '25.1'
      opts:
        is_expand: false
    - SCREAMING_FROG_EULA: '16'
      opts:
        is_expand: false
    meta:
      bitrise.io:
        stack: ubuntu-latest-stable
  upload_file_to_cdn:
