name = "changelog-proxy"
main = "./worker.js"
compatibility_date = "2023-08-23"
no_bundle = true
workers_dev = true
preview_urls = true

routes = [
  { pattern = "app.bitrise.io/changelog*", zone_name = "bitrise.io" },
  { pattern = "bitrise.io/changelog*", zone_name = "bitrise.io" },
]

[vars]
DISCOURSE_API_USERNAME = "changelog-proxy"

[[kv_namespaces]]
binding = "CHANGELOG"
id = "7581e3327b9f40b89276fc1bf7b2d66d"
